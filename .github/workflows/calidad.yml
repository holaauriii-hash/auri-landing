name: Calidad del landing

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 11 * * 1'

jobs:
  accesibilidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar herramientas
        run: |
          mkdir -p /tmp/qa && cd /tmp/qa
          npm init -y >/dev/null
          npm i playwright@1.56.0 axe-core@4.10.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Revisar accesibilidad (axe) y precios
        run: |
          cat > /tmp/qa/revisar.mjs <<'JS'
          import { chromium } from 'playwright';
          import { createServer } from 'node:http';
          import { readFile } from 'node:fs/promises';
          import { extname, join } from 'node:path';
          const root = process.env.GITHUB_WORKSPACE;
          const tipos = {'.html':'text/html','.js':'text/javascript','.woff2':'font/woff2','.jpg':'image/jpeg','.png':'image/png','.webp':'image/webp','.txt':'text/plain','.xml':'application/xml'};
          const srv = createServer(async (req, res) => {
            try { let p = decodeURIComponent(req.url.split('?')[0]); if (p === '/') p = '/index.html';
              const b = await readFile(join(root, p)); res.writeHead(200, {'content-type': tipos[extname(p)] || 'application/octet-stream'}); res.end(b);
            } catch { res.writeHead(404); res.end('no'); }
          }).listen(0);
          const port = srv.address().port;
          const browser = await chromium.launch();
          let fallos = 0;
          for (const [nombre, tz, loc] of [['Paraguay','America/Asuncion','es-PY'],['Exterior','Europe/Madrid','es-ES']]) {
            const ctx = await browser.newContext({ timezoneId: tz, locale: loc, viewport: { width: 390, height: 844 } });
            const page = await ctx.newPage();
            await page.goto(`http://127.0.0.1:${port}/`, { waitUntil: 'load' });
            await page.waitForTimeout(3500);
            await page.addScriptTag({ path: '/tmp/qa/node_modules/axe-core/axe.min.js' });
            const r = await page.evaluate(async () => await axe.run(document, { resultTypes: ['violations'] }));
            console.log(`${nombre}: ${r.violations.length} violaciones de accesibilidad`);
            r.violations.forEach(v => { fallos++; console.log(' -', v.id, v.nodes.map(n => n.target.join(' ')).join(' | ')); });
            const texto = await page.evaluate(() => document.body.innerText);
            if (!/200\.000/.test(texto)) { fallos++; console.log(' - No se ve el valor Gs 200.000'); }
            if (nombre === 'Paraguay' && !/100\.000/.test(texto)) { fallos++; console.log(' - No se ve la tarifa social Gs 100.000'); }
            const desborde = await page.evaluate(() => document.documentElement.scrollWidth > innerWidth);
            if (desborde) { fallos++; console.log(' - Hay desborde horizontal en celular'); }
            await ctx.close();
          }
          await browser.close(); srv.close();
          process.exit(fallos ? 1 : 0);
          JS
          cd /tmp/qa && node revisar.mjs
